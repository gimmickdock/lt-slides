<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI使って楽したり楽しくなったり</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
  <style>
    body,
    body.reveal-viewport {
      background: #f2eee3;
      color: #28261f;
    }

    .reveal {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", Meiryo, sans-serif;
    }

    .reveal .slides section {
      box-sizing: border-box;
      padding: 0 128px;
      text-align: left;
    }

    .reveal h1,
    .reveal h2 {
      margin: 0;
    }

    .reveal .slides .cover {
      height: 720px;
      padding-top: 94px;
    }

    .reveal h1 {
      font-size: 92px;
      font-weight: 500;
      line-height: 1.28;
      letter-spacing: -0.04em;
    }

    .cover-lead {
      display: block;
      margin-bottom: 18px;
      font-size: 48px;
    }

    .reveal h2 {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: 0.14em;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 460px;
      align-items: center;
      gap: 96px;
    }

    .speaker-name {
      margin: 24px 0 12px;
      font-size: 62px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: -0.04em;
    }

    .speaker-role {
      margin: 0;
      font-size: 28px;
      line-height: 1.5;
    }

    .intro img {
      display: block;
      width: 100%;
      height: auto;
    }

    .history {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 512px;
      align-items: center;
      gap: 64px;
    }

    .history .year {
      margin: 16px 0 6px;
      font-size: 108px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .history .event {
      margin: 0;
      font-size: 31px;
      line-height: 1.45;
    }

    .history figure {
      margin: 0;
    }

    .history img {
      display: block;
      width: 100%;
      height: auto;
    }

    .history figcaption {
      margin-top: 14px;
      font-size: 18px;
      line-height: 1.45;
    }

    .history a {
      color: inherit;
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section class="cover">
        <h1><span class="cover-lead">AI使って</span>楽したり<br>楽しくなったり</h1>
      </section>
      <section>
        <div class="intro">
          <div>
            <h2>自己紹介</h2>
            <p class="speaker-name">ノムラ</p>
            <p class="speaker-role">株式会社LegalOn Technologies<br>デザイナー</p>
          </div>
          <img src="assets/nomura.png" width="400" height="400" alt="ノムラの自己紹介画像">
        </div>
      </section>
      <section>
        <div class="history">
          <div>
            <h2>古参ムーブ</h2>
            <p class="year">2018</p>
            <p class="event">InHouseDesigners<br>vol. 3 に参加</p>
          </div>
          <figure>
            <img src="assets/inhouse-designers-2018.jpg" width="960" height="503" alt="InHouseDesigners vol. 3 のイベント参加レポートの見出し画像">
            <figcaption><a href="https://note.com/gimmickdock/n/n0c06da101080">当時の参加レポート（note）</a></figcaption>
          </figure>
        </div>
      </section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      width: 1280,
      height: 720,
      margin: 0,
      controls: false,
      progress: false,
      hash: true,
      transition: 'none'
    });
  </script>
</body>
</html>
