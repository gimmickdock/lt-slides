<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI使って楽したり楽しくなったり</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
  <style>
    body {
      background: #fff;
      color: #111;
    }

    .reveal {
      --display-font: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", Meiryo, sans-serif;
    }

    .reveal .slides section {
      box-sizing: border-box;
      padding: 0 152px;
      text-align: left;
    }

    .reveal h1,
    .reveal h2 {
      margin: 0;
    }

    .reveal h1 {
      font-family: var(--display-font);
      font-size: 86px;
      font-weight: 500;
      line-height: 1.32;
      letter-spacing: -0.025em;
      font-feature-settings: "palt";
    }

    .reveal h2 {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: 0.14em;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 336px;
      align-items: center;
      gap: 112px;
    }

    .intro p {
      margin: 38px 0 0;
      font-family: var(--display-font);
      font-size: 36px;
      line-height: 1.45;
    }

    .intro-lead {
      display: block;
      margin-bottom: 8px;
      font-size: 64px;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .intro img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section>
        <h1>AI使って楽したり<br>楽しくなったり</h1>
      </section>
      <section>
        <div class="intro">
          <div>
            <h2>自己紹介</h2>
            <p><span class="intro-lead">ノムラです。</span>こんにちは。</p>
          </div>
          <img src="assets/nomura.png" width="400" height="400" alt="ノムラの自己紹介画像">
        </div>
      </section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      width: 1280,
      height: 720,
      margin: 0,
      controls: false,
      progress: false,
      hash: true,
      transition: 'none'
    });
  </script>
</body>
</html>
