<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LT Slides</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/theme/black.css">
  <style>
    .reveal { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
    .reveal h1 { font-size: 2.5em; font-weight: 700; }
    .reveal p { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section><h1>LT Slides</h1><p>プレゼンテーションの準備中</p></section>
      <section><h2>2枚目のスライド</h2><p>← → キーで移動できます</p></section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>
  <script>Reveal.initialize({ hash: true, slideNumber: true });</script>
</body>
</html>
